<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級像素小鎮</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>

<div id="app">

  <header id="toolbar">
    <span id="title"></span>
    <button id="btn-connect" class="tbtn">連接資料夾</button>
    <button id="btn-reload" class="tbtn" disabled>重新載入檔案</button>
    <button id="btn-edit" class="tbtn" disabled>編輯模式：關（E）</button>
    <button id="btn-undo" class="tbtn" disabled title="復原最後一次加分（Ctrl+Z）">復原</button>
    <span id="save-state" class="muted"></span>
    <span id="status" class="muted"></span>
  </header>

  <!-- 雙層畫布：
       #stage  像素層，原生地圖解析度，用 CSS 整數倍放大，image-rendering: pixelated
       #labels UI 層，原生螢幕解析度，畫名字與進度條，字體才不會被放大糊掉 -->
  <div id="stage-wrap">
    <canvas id="stage"></canvas>
    <canvas id="labels"></canvas>
  </div>

  <!-- 授權標示是素材的使用條件，不是選配。
       貓的素材來源尚待老師補上，請勿填入未經確認的連結。 -->
  <footer id="credits">
    貓：<span id="credit-cat">（素材來源待補，見 CREDITS.md）</span>　·
    地圖：<a href="https://cainos.itch.io/pixel-art-top-down-basic" target="_blank" rel="noopener">Cainos — Pixel Art Top Down - Basic</a>
  </footer>

</div>

<aside id="panel" hidden>
  <button id="panel-close" title="關閉（Esc）">×</button>

  <div id="panel-cat-wrap">
    <canvas id="panel-cat" width="128" height="128"></canvas>
  </div>

  <div id="panel-name"></div>
  <div id="panel-seat"></div>

  <div id="panel-level-row">
    <span id="panel-level"></span>
    <span id="panel-title"></span>
  </div>

  <div id="panel-bar"><div id="panel-bar-fill"></div></div>
  <div id="panel-meta">
    <span id="panel-xp"></span>
    <span id="panel-next"></span>
  </div>

  <div id="panel-awards"></div>
  <div id="panel-maxed-note" hidden>已達最高等級，不再累積分數。</div>
  <div id="panel-hint">快捷鍵：空白鍵或 Enter 加分　·　Esc 關閉</div>

  <div id="panel-levelup"></div>

  <div id="panel-log-head">最近的紀錄</div>
  <ul id="panel-log"></ul>
</aside>

<div id="toast" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" type="button">取消復原</button>
</div>

<div id="banner" hidden></div>

<script src="js/config.js"></script>
<script src="js/anims.js"></script>
<script src="js/tileset.js"></script>
<script src="js/assets.js"></script>
<script src="js/storage.js"></script>
<script src="js/model.js"></script>
<script src="js/map.js"></script>
<script src="js/cats.js"></script>
<script src="js/panel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
