<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級像素小鎮</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>

<!-- 模糊化的草地背景，取自地圖素材本身，讓畫布之外不再是一片死黑 -->
<div id="bg"></div>

<div id="app">

  <header id="toolbar">
    <span id="title"></span>

    <!-- 沒連接資料夾前顯示這顆；連上之後換成班級下拉選單與更換資料夾按鈕 -->
    <button id="btn-connect" class="tbtn tbtn-icon" title="連接資料夾">📁</button>

    <label id="class-wrap" hidden>
      <span class="tlabel">班級</span>
      <select id="class-select" class="tselect"></select>
    </label>
    <button id="btn-disconnect" class="tbtn tbtn-icon" hidden title="更換資料夾">📁</button>

    <button id="btn-reload" class="tbtn tbtn-icon" disabled title="重新載入檔案">↻</button>
    <button id="btn-mapedit" class="tbtn tbtn-icon" title="地圖編輯">✎</button>

    <span id="conn-light" class="light" title="尚未連接資料夾"></span>

    <span id="status" class="muted"></span>
    <span id="save-state" class="muted"></span>
  </header>

  <!-- 雙層畫布：
       #stage  像素層，原生地圖解析度，用 CSS 整數倍放大，image-rendering: pixelated
       #labels UI 層，原生螢幕解析度，畫名字與進度條，字體才不會被放大糊掉 -->
  <div id="stage-wrap">
    <canvas id="stage"></canvas>
    <canvas id="labels"></canvas>
  </div>


</div>

<aside id="editor" hidden>
  <div id="ed-bar">
    <span id="ed-title">地圖編輯</span>
    <button id="ed-regen" class="tbtn">重新產生</button>
    <button id="ed-save" class="tbtn">儲存地圖</button>
    <button id="ed-close" class="tbtn tbtn-icon">×</button>
  </div>
  <div id="ed-hint"></div>
  <div id="ed-palette"></div>
</aside>

<aside id="panel" hidden>
  <button id="panel-close" title="關閉（Esc）">×</button>

  <div id="panel-cat-wrap">
    <canvas id="panel-cat" width="128" height="128"></canvas>
  </div>

  <div id="panel-name"></div>
  <div id="panel-seat"></div>

  <div id="panel-level-row">
    <span id="panel-level"></span>
    <span id="panel-title"></span>
  </div>

  <div id="panel-bar"><div id="panel-bar-fill"></div></div>
  <div id="panel-meta">
    <span id="panel-xp"></span>
    <span id="panel-next"></span>
  </div>

  <div id="panel-awards"></div>
  <button id="panel-note-btn" class="note-btn" type="button" hidden>登記</button>
  <div id="panel-maxed-note" hidden>已達最高等級，不再累積分數。</div>

  <div id="panel-levelup"></div>

  <div id="panel-log-head">最近的紀錄</div>
  <ul id="panel-log"></ul>
</aside>

<!-- 登記事由的對話框。置中蓋在畫面上，確認才會寫入紀錄。 -->
<div id="note-modal" hidden>
  <div id="note-box" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <div id="note-title">登記事由</div>
    <div id="note-who"></div>

    <input id="note-input" type="text" autocomplete="off"
           placeholder="例如：上課睡覺、上課吵鬧">

    <div id="note-presets"></div>

    <div id="note-actions">
      <button id="note-cancel" class="modal-btn modal-btn-grey" type="button">取消</button>
      <button id="note-confirm" class="modal-btn modal-btn-main" type="button">確認</button>
    </div>
  </div>
</div>

<div id="toast" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" type="button">取消復原</button>
</div>

<div id="banner" hidden></div>

<script src="js/config.js"></script>
<script src="js/anims.js"></script>
<script src="js/tileset.js"></script>
<script src="js/assets.js"></script>
<script src="js/storage.js"></script>
<script src="js/model.js"></script>
<script src="js/map.js"></script>
<script src="js/cats.js"></script>
<script src="js/panel.js"></script>
<script src="js/mapedit.js"></script>
<script src="js/main.js"></script>
</body>
</html>
