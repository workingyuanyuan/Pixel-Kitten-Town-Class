<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級像素小鎮</title>
<link rel="stylesheet" href="css/main.css?v=20261103">
<link rel="stylesheet" href="css/panel.css?v=20261103">
<link rel="stylesheet" href="css/appearance.css?v=20261103">
</head>
<body>

<div id="app">

  <header id="toolbar">
    <span id="title"></span>

    <!-- 沒連接資料夾前顯示這顆；連上之後換成班級下拉選單與更換資料夾按鈕 -->
    <button id="btn-connect" class="tbtn tbtn-icon" title="連接資料夾">📁</button>

    <label id="class-wrap" hidden>
      <span class="tlabel">班級</span>
      <select id="class-select" class="tselect"></select>
    </label>
    <button id="btn-disconnect" class="tbtn tbtn-icon" hidden title="更換資料夾">📁</button>

    <button id="btn-reload" class="tbtn tbtn-icon" disabled title="重新載入檔案">↻</button>
    <button id="btn-mapedit" class="tbtn tbtn-icon" title="地圖編輯">✎</button>
    <button id="btn-weather" class="tbtn tbtn-icon" title="天氣">🌤️</button>

    <span id="conn-light" class="light" title="尚未連接資料夾"></span>

    <span id="status" class="muted"></span>

    <!-- 全班共同目標。圓圈由 main.js 的 buildClassGoal() 依 CONFIG.CLASS_GOAL 產生 -->
    <div id="class-goal" hidden>
      <span class="tlabel">全班目標</span>
      <div id="goal-track"><div id="goal-fill"></div></div>
      <span id="goal-num" class="muted"></span>
    </div>
    <span id="save-state" class="muted"></span>
  </header>

  <!-- 雙層畫布：
       #stage  像素層，地圖加外圍郊外，放大到塞得下的最大尺寸（見 main.js 的 layout）
       #labels UI 層，原生螢幕解析度，畫名字與進度條，字體才不會被放大糊掉 -->
  <div id="stage-wrap">
    <canvas id="stage"></canvas>
    <canvas id="labels"></canvas>
  </div>


</div>

<aside id="editor" hidden>
  <div id="ed-bar">
    <span id="ed-title">地圖編輯</span>
    <button id="ed-regen" class="tbtn">重新產生</button>
    <button id="ed-save" class="tbtn">儲存地圖</button>
    <button id="ed-close" class="tbtn tbtn-icon">×</button>
  </div>
  <div id="ed-hint"></div>
  <div id="ed-palette"></div>
</aside>

<aside id="panel" hidden>
  <button id="panel-close" title="關閉（Esc）">×</button>

  <div id="panel-cat-wrap">
    <canvas id="panel-cat" width="128" height="128"></canvas>
  </div>

  <div id="panel-name-row">
    <div id="panel-name"></div>
    <button id="panel-helper" type="button" aria-label="設為小老師" aria-pressed="false" title="設為小老師">☆</button>
  </div>
  <div id="panel-seat"></div>

  <div id="panel-level-row">
    <span id="panel-level"></span>
    <span id="panel-title"></span>
  </div>

  <div id="panel-bar"><div id="panel-bar-fill"></div></div>
  <div id="panel-meta">
    <span id="panel-xp"></span>
    <span id="panel-next"></span>
  </div>
  <div id="panel-unlock"></div>
  <div id="panel-today"></div>

  <div id="panel-awards"></div>
  <button id="panel-note-btn" class="note-btn" type="button" hidden>登記</button>
  <div id="panel-maxed-note" hidden>已達最高等級，不再累積分數。</div>

  <div id="panel-levelup"></div>

  <div id="panel-log-head">最近的紀錄</div>
  <ul id="panel-log"></ul>
  <div id="panel-footer">
    <button id="panel-appearance" class="tbtn" type="button">編輯形象</button>
  </div>
</aside>

<dialog id="appearance-dialog" aria-labelledby="appearance-title" aria-describedby="appearance-who">
  <div class="appearance-heading">
    <div><h2 id="appearance-title">我的小鎮形象</h2><p id="appearance-who"></p></div>
    <button id="appearance-close" class="tbtn" type="button" aria-label="關閉形象編輯器">×</button>
  </div>
  <div class="appearance-layout">
    <div class="appearance-showcase">
      <div class="appearance-stage"><canvas id="appearance-preview" width="192" height="192" role="img" aria-label="動態形象預覽"></canvas></div>
      <div id="appearance-actions" class="appearance-actions" role="group" aria-label="預覽動作">
        <button type="button" data-action="idle" aria-pressed="true">待機</button>
        <button type="button" data-action="walk" aria-pressed="false">走路</button>
        <button type="button" data-action="celebrate" aria-pressed="false">加分</button>
      </div>
      <p class="appearance-caption">選一個喜歡的模樣，住進小鎮。</p>
    </div>
    <div class="appearance-options">
      <fieldset><legend>動物形象</legend><div id="appearance-species" class="appearance-species"></div></fieldset>
      <div id="appearance-cat-options">
        <fieldset><legend>毛色</legend><div id="appearance-bases" class="appearance-bases"></div></fieldset>
        <label class="appearance-label" for="appearance-accessory">配件</label>
        <select id="appearance-accessory" class="tselect"></select>
      </div>
    </div>
  </div>
  <p id="appearance-status" role="status" aria-live="polite"></p>
  <div class="appearance-footer">
    <button id="appearance-cancel" class="modal-btn modal-btn-grey" type="button">取消</button>
    <button id="appearance-apply" class="modal-btn modal-btn-main" type="button">套用形象</button>
  </div>
</dialog>

<!-- 登記事由的對話框。置中蓋在畫面上，確認才會寫入紀錄。 -->
<div id="note-modal" hidden>
  <div id="note-box" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <div id="note-title">登記事由</div>
    <div id="note-who"></div>

    <input id="note-input" type="text" autocomplete="off"
           placeholder="例如：趴睡、吵鬧">

    <div id="note-presets"></div>

    <div id="note-actions">
      <button id="note-cancel" class="modal-btn modal-btn-grey" type="button">取消</button>
      <button id="note-confirm" class="modal-btn modal-btn-main" type="button">確認</button>
    </div>
  </div>
</div>

<div id="toast" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" type="button">取消復原</button>
</div>

<div id="banner" hidden></div>

<!-- ?v= 是為了讓瀏覽器丟掉快取裡的舊檔。tools/serve.py 已經會叫瀏覽器每次確認，
     這個號碼只是給「換伺服器之前就快取的舊檔」用的，之後不必再改。 -->
<script src="js/config.js?v=20261103"></script>
<script src="js/anims.js?v=20261103"></script>
<script src="js/animals.js?v=20261103"></script>
<script src="js/tileset.js?v=20261103"></script>
<script src="js/assets.js?v=20261103"></script>
<script src="js/storage.js?v=20261103"></script>
<script src="js/model.js?v=20261103"></script>
<script src="js/map.js?v=20261103"></script>
<script src="js/water.js?v=20261103"></script>
<script src="js/ground.js?v=20261103"></script>
<script src="js/weather.js?v=20261103"></script>
<script src="js/ambience.js?v=20261103"></script>
<script src="js/cats.js?v=20261103"></script>
<script src="js/catfx.js?v=20261103"></script>
<script src="js/panel.js?v=20261103"></script>
<script src="js/appearance.js?v=20261103"></script>
<script src="js/mapedit.js?v=20261103"></script>
<script src="js/main.js?v=20261103"></script>
</body>
</html>
